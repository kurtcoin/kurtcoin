<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>

    <!-- Outer Ring Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#000dff" />
    </linearGradient>

    <!-- Wolf Metallic Gradient -->
    <linearGradient id="wolfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e6ed" />
      <stop offset="70%" stop-color="#8892b0" />
      <stop offset="100%" stop-color="#4a5568" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="url(#bgGrad)" stroke="#1c2541" stroke-width="4" />

  <!-- Outer Neon Circuit Ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="15 8" filter="url(#glow)" />
  <circle cx="250" cy="250" r="205" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.5" />

  <!-- Blockchain Nodes / Stars -->
  <circle cx="250" cy="35" r="5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="465" cy="250" r="5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="250" cy="465" r="5" fill="#00f2fe" filter="url(#glow)" />
  <circle cx="35" cy="250" r="5" fill="#00f2fe" filter="url(#glow)" />

  <!-- Stylized Geometric Wolf Head -->
  <g transform="translate(100, 90) scale(0.6)">
    <!-- Ears -->
    <polygon points="120,40 180,180 80,160" fill="url(#wolfGrad)" />
    <polygon points="380,40 420,160 320,180" fill="url(#wolfGrad)" />
    <polygon points="140,80 170,160 100,150" fill="#00f2fe" opacity="0.8" />
    <polygon points="360,80 400,150 330,160" fill="#00f2fe" opacity="0.8" />

    <!-- Forehead & Cheeks -->
    <polygon points="250,110 180,180 320,180" fill="#ffffff" />
    <polygon points="180,180 250,260 110,230" fill="url(#wolfGrad)" />
    <polygon points="320,180 390,230 250,260" fill="url(#wolfGrad)" />

    <!-- Outer Mane / Fur -->
    <polygon points="110,230 180,290 60,260" fill="#8892b0" />
    <polygon points="390,230 440,260 320,290" fill="#8892b0" />
    <polygon points="180,290 250,330 120,350" fill="url(#wolfGrad)" />
    <polygon points="320,290 380,350 250,330" fill="url(#wolfGrad)" />

    <!-- Eyes (Glowing Cyan) -->
    <polygon points="180,200 230,225 170,225" fill="#00f2fe" filter="url(#glow)" />
    <polygon points="320,200 330,225 270,225" fill="#00f2fe" filter="url(#glow)" />

    <!-- Muzzle / Snout -->
    <polygon points="250,260 210,360 290,360" fill="#ffffff" />
    <polygon points="210,360 250,420 290,360" fill="#1c2541" />

    <!-- Nose (Glow Cyan Point) -->
    <polygon points="240,405 260,405 250,420" fill="#00f2fe" filter="url(#glow)" />
  </g>

  <!-- Currency Text -->
  <text x="250" y="415" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="8">KURTCOIN</text>
  <text x="250" y="440" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#00f2fe" letter-spacing="4">THE WOLFPACK NETWORK</text>
</svg>
